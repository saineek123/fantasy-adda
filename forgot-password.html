<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Fantasy Adda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #8B0000, #d40000); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .card { width: 100%; max-width: 400px; background: #ffffff; border-radius: 20px; padding: 35px 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); animation: fadeIn 0.6s ease; }
        .logo { width: 90px; display: block; margin: auto; margin-bottom: 20px; }
        .card h2 { text-align: center; color: #b80000; margin-bottom: 5px; }
        .card p { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        .input-box { position: relative; margin-bottom: 20px; }
        .input-box i { position: absolute; left: 15px; top: 16px; color: #888; }
        .input-box input { width: 100%; padding: 14px 45px; border: 1px solid #ddd; border-radius: 12px; outline: none; font-size: 15px; transition: border-color 0.3s; }
        .input-box input:focus { border-color: #b80000; }
        button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #b80000; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #8b0000; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .bottom { text-align: center; margin-top: 20px; color: #555; font-size: 14px; }
        .bottom a { color: #b80000; text-decoration: none; font-weight: bold; }
        .bottom a:hover { text-decoration: underline; }
        .error-msg { color: #d40000; font-size: 14px; text-align: center; margin-top: 10px; display: none; background: #fff0f0; padding: 10px; border-radius: 8px; border: 1px solid #ffd6d6; }
        .success-msg { color: #28a745; font-size: 14px; text-align: center; margin-top: 10px; display: none; background: #f0fff4; padding: 10px; border-radius: 8px; border: 1px solid #d4edda; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @media(max-width:450px) { .card { padding: 25px 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="assets/logo.png" alt="Fantasy Adda Logo" class="logo">
            <h2>Forgot Password</h2>
            <p>Enter your email to reset your password</p>
            <form id="resetForm">
                <div class="input-box">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                </div>
                <button type="submit" id="resetBtn">Send Reset Link</button>
                <div id="errorMsg" class="error-msg"></div>
                <div id="successMsg" class="success-msg"></div>
            </form>
            <div class="bottom">
                Remember your password? <a href="login.html">Login</a>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyACztDFFn-xL75-32PYd1vsyjHKBod-UzA",
            authDomain: "fantasy-adda-e3b72.firebaseapp.com",
            projectId: "fantasy-adda-e3b72",
            storageBucket: "fantasy-adda-e3b72.firebasestorage.app",
            messagingSenderId: "882657286194",
            appId: "1:882657286194:web:284e818359de2363f0442b",
            measurementId: "G-8HJX9NRL1B"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const resetForm = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const emailInput = document.getElementById('email');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; successMsg.style.display = 'none'; }
        function showSuccess(msg) { successMsg.textContent = msg; successMsg.style.display = 'block'; errorMsg.style.display = 'none'; }
        function hideMessages() { errorMsg.style.display = 'none'; successMsg.style.display = 'none'; }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            const email = emailInput.value.trim();
            if (!email) { showError('Please enter your email'); return; }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Sending...';

            try {
                await auth.sendPasswordResetEmail(email);
                showSuccess('Password reset email sent! Check your inbox 📧');
                setTimeout(() => { window.location.href = 'login.html'; }, 3000);
            } catch (error) {
                let msg = 'Failed to send reset email. Please try again.';
                if (error.code === 'auth/user-not-found') msg = 'No account found with this email.';
                else if (error.code === 'auth/invalid-email') msg = 'Invalid email address.';
                showError(msg);
            } finally {
                resetBtn.disabled = false;
                resetBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
