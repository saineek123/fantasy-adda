<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Add Money</title>

<link rel="stylesheet"
href="css/add-money.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header>

<a href="wallet.html">

<i class="fa fa-arrow-left"></i>

</a>

<h2>Add Money</h2>

</header>

<div class="container">

<div class="amount-card">

<h3>Enter Amount</h3>

<input
type="number"
id="amount"
placeholder="₹ Enter Amount">

</div>

<h3>Quick Amount</h3>

<div class="quick-grid">

<button class="quick-btn">100</button>

<button class="quick-btn">200</button>

<button class="quick-btn">500</button>

<button class="quick-btn">1000</button>

<button class="quick-btn">2000</button>

<button class="quick-btn">5000</button>

</div>

<button
class="continue-btn"
id="continueBtn">

Continue

</button>

</div>

<script type="module"
src="js/add-money.js">

</script>

</body>

</html>
