<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw - Fantasy Adda</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6fa;
    padding-bottom:80px;
}

header{
    background:#B80000;
    color:white;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

header h2{
    font-size:20px;
    display:flex;
    gap:10px;
    align-items:center;
}

.back-btn{
    color:white;
    text-decoration:none;
    font-size:22px;
}

.container{
    max-width:520px;
    margin:20px auto;
    padding:0 15px;
}

.balance-card{
    background:linear-gradient(135deg,#B80000,#ff4d4d);
    color:white;
    padding:25px 20px;
    border-radius:16px;
    text-align:center;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(184,0,0,.25);
}

.balance-card h3{
    font-size:14px;
    font-weight:400;
    opacity:.9;
}

.balance-card h1{
    font-size:34px;
    margin-top:5px;
}

.card{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:10px;
}

.card-title i{
    color:#B80000;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-size:14px;
    font-weight:bold;
    color:#333;
    margin-bottom:7px;
}

.form-group input{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:11px;
    font-size:16px;
    outline:none;
}

.form-group input:focus{
    border-color:#B80000;
}

.withdraw-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#B80000;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.withdraw-btn:disabled{
    background:#999;
}

.info{
    margin-top:15px;
    background:#fff7f7;
    border:1px solid #ffd0d0;
    padding:12px;
    border-radius:10px;
    color:#666;
    font-size:13px;
    line-height:1.6;
}

.toast{
    position:fixed;
    top:20px;
    right:20px;
    max-width:330px;
    padding:15px 20px;
    border-radius:10px;
    color:white;
    display:none;
    z-index:9999;
}

.toast.success{
    background:#28a745;
}

.toast.error{
    background:#d40000;
}

nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:11px 0;
    box-shadow:0 -3px 10px rgba(0,0,0,.12);
    z-index:100;
}

nav a{
    text-decoration:none;
    color:#666;
    font-size:12px;
    text-align:center;
}

nav i{
    display:block;
    font-size:20px;
    margin-bottom:5px;
}

nav a.active,
nav a.active i{
    color:#B80000;
}

</style>
</head>

<body>

<header>

    <h2>
        <i class="fa fa-building-columns"></i>
        Withdraw
    </h2>

    <a href="wallet.html" class="back-btn">
        <i class="fa fa-times"></i>
    </a>

</header>


<div class="container">

    <div class="balance-card">

        <h3>Available Balance</h3>

        <h1 id="balance">₹0</h1>

    </div>


    <div class="card">

        <div class="card-title">
            <i class="fa fa-university"></i>
            Bank Account
        </div>


        <div class="form-group">

            <label>Withdrawal Amount</label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="50"
                inputmode="numeric"
            >

        </div>


        <div class="form-group">

            <label>Account Holder Name</label>

            <input
                type="text"
                id="accountName"
                placeholder="Enter account holder name"
                maxlength="100"
            >

        </div>


        <div class="form-group">

            <label>Bank Name</label>

            <input
                type="text"
                id="bankName"
                placeholder="Enter bank name"
                maxlength="100"
            >

        </div>


        <div class="form-group">

            <label>Account Number</label>

            <input
                type="password"
                id="accountNumber"
                placeholder="Enter account number"
                inputmode="numeric"
                maxlength="20"
            >

        </div>


        <div class="form-group">

            <label>Confirm Account Number</label>

            <input
                type="password"
                id="confirmAccountNumber"
                placeholder="Confirm account number"
                inputmode="numeric"
                maxlength="20"
            >

        </div>


        <div class="form-group">

            <label>IFSC Code</label>

            <input
                type="text"
                id="ifsc"
                placeholder="Example: SBIN0001234"
                maxlength="11"
                style="text-transform:uppercase"
            >

        </div>


        <button
            class="withdraw-btn"
            id="withdrawBtn">

            <i class="fa fa-paper-plane"></i>
            Submit Withdrawal

        </button>


        <div class="info">

            <i class="fa fa-circle-info"></i>

            Minimum withdrawal ₹50.
            Your request will first go to admin for approval.
            Balance will be adjusted only after admin approval.

        </div>

    </div>

</div>


<nav>

    <a href="index.html">
        <i class="fa fa-home"></i>
        Home
    </a>

    <a href="matches.html">
        <i class="fa fa-trophy"></i>
        Matches
    </a>

    <a href="wallet.html" class="active">
        <i class="fa fa-wallet"></i>
        Wallet
    </a>

    <a href="profile.html">
        <i class="fa fa-user"></i>
        Profile
    </a>

</nav>


<div class="toast" id="toast">
    <span id="toastMessage"></span>
</div>


<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {

    apiKey:"AIzaSyACztDFFn-xL75-32PYd1vsyjHKBod-UzA",

    authDomain:"fantasy-adda-e3b72.firebaseapp.com",

    projectId:"fantasy-adda-e3b72",

    storageBucket:"fantasy-adda-e3b72.firebasestorage.app",

    messagingSenderId:"882657286194",

    appId:"1:882657286194:web:284e818359de2363f0442b",

    measurementId:"G-8HJX9NRL1B"

};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

let currentUser=null;
let userBalance=0;

const balanceEl=document.getElementById("balance");

const amount=document.getElementById("amount");
const accountName=document.getElementById("accountName");
const bankName=document.getElementById("bankName");
const accountNumber=document.getElementById("accountNumber");
const confirmAccountNumber=document.getElementById("confirmAccountNumber");
const ifsc=document.getElementById("ifsc");
const withdrawBtn=document.getElementById("withdrawBtn");

const toast=document.getElementById("toast");
const toastMessage=document.getElementById("toastMessage");

let toastTimer;


function showToast(message,type="success"){

    toast.className="toast "+type;

    toastMessage.textContent=message;

    toast.style.display="block";

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        toast.style.display="none";
    },3500);
}


auth.onAuthStateChanged(user=>{

    if(!user){

        window.location.href="login.html";

        return;
    }

    currentUser=user;

    db.ref("users/"+user.uid+"/wallet/balance")
      .on("value",snap=>{

        userBalance=Number(snap.val())||0;

        balanceEl.textContent=
            "₹"+userBalance.toLocaleString("en-IN");

    });

});


accountNumber.addEventListener("input",function(){

    this.value=this.value
        .replace(/\D/g,"")
        .slice(0,20);

});


confirmAccountNumber.addEventListener("input",function(){

    this.value=this.value
        .replace(/\D/g,"")
        .slice(0,20);

});


ifsc.addEventListener("input",function(){

    this.value=this.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g,"")
        .slice(0,11);

});


withdrawBtn.addEventListener("click",async()=>{

    const amt=Number(amount.value);

    const holder=accountName.value.trim();

    const bank=bankName.value.trim();

    const acc=accountNumber.value.trim();

    const confirmAcc=confirmAccountNumber.value.trim();

    const ifscCode=ifsc.value.trim().toUpperCase();


    if(!amt || amt<50){

        showToast("Minimum withdrawal is ₹50","error");

        return;
    }


    if(amt>userBalance){

        showToast("Insufficient balance","error");

        return;
    }


    if(!holder){

        showToast("Enter account holder name","error");

        return;
    }


    if(!bank){

        showToast("Enter bank name","error");

        return;
    }


    if(acc.length<9){

        showToast("Enter valid account number","error");

        return;
    }


    if(acc!==confirmAcc){

        showToast("Account numbers do not match","error");

        return;
    }


    const ifscRegex=/^[A-Z]{4}0[A-Z0-9]{6}$/;

    if(!ifscRegex.test(ifscCode)){

        showToast("Enter valid IFSC code","error");

        return;
    }


    withdrawBtn.disabled=true;

    withdrawBtn.innerHTML=
        '<i class="fa fa-spinner fa-spin"></i> Submitting...';


    try{

        /*
        Recheck latest balance.
        */

        const balanceSnap=
            await db.ref(
                "users/"+currentUser.uid+"/wallet/balance"
            ).once("value");


        const latestBalance=
            Number(balanceSnap.val())||0;


        if(amt>latestBalance){

            showToast(
                "Insufficient balance",
                "error"
            );

            return;
        }


        /*
        Payment details string
        */

        const paymentDetails=
            "Bank Account | Holder: "+
            holder+
            " | Bank: "+
            bank+
            " | Account: "+
            acc+
            " | IFSC: "+
            ifscCode;


        /*
        Create pending request.
        IMPORTANT:
        No wallet deduction here.
        */

        await db.ref("withdrawals").push({

            userId:currentUser.uid,

            amount:amt,

            accountName:holder,

            bankName:bank,

            accountNumber:acc,

            ifsc:ifscCode,

            paymentDetails:paymentDetails,

            status:"pending",

            createdAt:Date.now()

        });


        showToast(
            "Withdrawal request sent to admin successfully!",
            "success"
        );


        amount.value="";
        accountName.value="";
        bankName.value="";
        accountNumber.value="";
        confirmAccountNumber.value="";
        ifsc.value="";


        setTimeout(()=>{

            window.location.href="wallet.html";

        },1800);


    }catch(error){

        console.error(error);

        showToast(
            "Unable to submit withdrawal request.",
            "error"
        );

    }finally{

        withdrawBtn.disabled=false;

        withdrawBtn.innerHTML=
            '<i class="fa fa-paper-plane"></i> Submit Withdrawal';

    }

});

</script>

</body>
</html>
