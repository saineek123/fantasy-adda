<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fantasy Adda</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6fa;
    color:#222;
    padding-bottom:85px;
}

/* ================= HEADER ================= */

header{
    background:#B80000;
    color:#fff;
    height:64px;
    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.logo{
    font-size:23px;
    font-weight:700;
}

.profile a{
    color:white;
    text-decoration:none;
    font-size:23px;
}

/* ================= MATCH SECTION ================= */

.section{
    margin:18px 15px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.section-title h2{
    font-size:22px;
    color:#222;
}

.view-all{
    color:#B80000;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
}

/* ================= MATCH CARD ================= */

.match-card{
    background:#fff;
    padding:17px;
    border-radius:17px;
    margin-bottom:15px;

    box-shadow:0 4px 12px rgba(0,0,0,.09);

    border:1px solid #eee;
}

.match-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.league{
    font-size:13px;
    color:#777;
    font-weight:600;
}

.status{
    font-size:11px;
    font-weight:bold;
    padding:5px 9px;
    border-radius:20px;
    background:#ffeaea;
    color:#B80000;
}

.status.upcoming{
    background:#fff3cd;
    color:#9a6900;
}

.teams{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.team{
    width:38%;
    text-align:center;
}

.team img{
    width:58px;
    height:58px;
    object-fit:contain;
    border-radius:50%;
    margin-bottom:7px;
}

.team p{
    font-size:15px;
    font-weight:600;
    color:#222;
}

.vs{
    width:24%;
    text-align:center;
    font-size:17px;
    font-weight:800;
    color:#B80000;
}

.match-info{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:12px;
}

.tradeBtn{
    display:block;
    width:100%;

    margin-top:14px;
    padding:12px;

    background:#B80000;
    color:white;

    border:none;
    border-radius:11px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
    transition:.2s;
}

.tradeBtn:active{
    transform:scale(.98);
}

.tradeBtn:hover{
    background:#990000;
}

/* ================= EMPTY ================= */

.empty{
    background:#fff;
    border-radius:15px;
    padding:40px 20px;

    text-align:center;
    color:#777;

    box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.empty i{
    font-size:38px;
    color:#B80000;
    margin-bottom:12px;
}

.empty h3{
    margin-bottom:6px;
    color:#333;
}

.empty p{
    font-size:13px;
}

/* ================= BOTTOM NAV ================= */

nav{
    position:fixed;
    left:0;
    bottom:0;

    width:100%;

    background:#fff;

    display:flex;
    justify-content:space-around;

    padding:10px 0 9px;

    box-shadow:0 -3px 12px rgba(0,0,0,.12);

    z-index:999;
}

nav a{
    flex:1;

    text-decoration:none;
    color:#777;

    font-size:11px;
    text-align:center;
}

nav i{
    display:block;

    font-size:20px;
    margin-bottom:4px;

    color:#B80000;
}

nav a.active{
    color:#B80000;
    font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .logo{
        font-size:21px;
    }

    .section{
        margin:18px 12px;
    }

    .section-title h2{
        font-size:20px;
    }

    .match-card{
        padding:15px;
    }

    .team img{
        width:55px;
        height:55px;
    }

    .team p{
        font-size:14px;
    }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        🏏 Fantasy Adda
    </div>

    <div class="profile">
        <a href="profile.html">
            <i class="fa-solid fa-user"></i>
        </a>
    </div>

</header>


<!-- ================= LIVE / UPCOMING MATCHES ================= -->

<section class="section">

    <div class="section-title">

        <h2>🔥 Live Matches</h2>

        <a href="matches.html" class="view-all">
            View All
        </a>

    </div>

    <div id="liveMatches">

        <div class="empty">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <h3>Loading Matches...</h3>

            <p>Please wait</p>

        </div>

    </div>

</section>


<!-- ================= BOTTOM NAV ================= -->

<nav>

    <a href="index.html" class="active">

        <i class="fa fa-home"></i>

        Home

    </a>


    <a href="matches.html">

        <i class="fa fa-trophy"></i>

        Matches

    </a>


    <a href="wallet.html">

        <i class="fa fa-wallet"></i>

        Wallet

    </a>


    <a href="profile.html">

        <i class="fa fa-user"></i>

        Profile

    </a>

</nav>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-database-compat.js"></script>


<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey: "AIzaSyACztDFFn-xL75-32PYd1vsyjHKBod-UzA",

    authDomain: "fantasy-adda-e3b72.firebaseapp.com",

    projectId: "fantasy-adda-e3b72",

    storageBucket: "fantasy-adda-e3b72.firebasestorage.app",

    messagingSenderId: "882657286194",

    appId: "1:882657286194:web:284e818359de2363f0442b",

    measurementId: "G-8HJX9NRL1B"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const database = firebase.database();


/* =========================================
   ELEMENTS
========================================= */

const liveMatches =
    document.getElementById("liveMatches");


/* =========================================
   USER AUTH CHECK
========================================= */

auth.onAuthStateChanged((user)=>{

    if(!user){

        window.location.href = "login.html";

        return;

    }

});


/* =========================================
   LOAD MATCHES FROM FIREBASE
========================================= */

const matchesRef = database.ref("matches");


matchesRef.on("value",(snapshot)=>{

    liveMatches.innerHTML = "";


    if(!snapshot.exists()){

        liveMatches.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-trophy"></i>

                <h3>No Matches Available</h3>

                <p>New matches will appear here.</p>

            </div>

        `;

        return;

    }


    const matches = snapshot.val();

    let found = false;


    Object.keys(matches).forEach((id)=>{

        const match = matches[id];


        /*
          ONLY LIVE AND UPCOMING
        */

        if(
            match.status === "Live" ||
            match.status === "Upcoming"
        ){

            found = true;

            createMatchCard(id,match);

        }

    });


    if(!found){

        liveMatches.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-trophy"></i>

                <h3>No Live Matches</h3>

                <p>There are no live or upcoming matches right now.</p>

            </div>

        `;

    }

});


/* =========================================
   CREATE MATCH CARD
========================================= */

function createMatchCard(id,match){

    const card =
        document.createElement("div");


    card.className = "match-card";


    const statusClass =
        match.status === "Upcoming"
        ? "upcoming"
        : "";


    card.innerHTML = `

        <div class="match-top">

            <div class="league">

                ${escapeHTML(match.league || "Sports Match")}

            </div>

            <div class="status ${statusClass}">

                ${escapeHTML(match.status || "Live")}

            </div>

        </div>


        <div class="teams">

            <div class="team">

                <img

                    src="${match.teamALogo || "assets/default-team.png"}"

                    alt="${escapeHTML(match.teamA || "Team A")}"

                    onerror="this.src='assets/default-team.png'"

                >

                <p>

                    ${escapeHTML(match.teamA || "Team A")}

                </p>

            </div>


            <div class="vs">

                VS

            </div>


            <div class="team">

                <img

                    src="${match.teamBLogo || "assets/default-team.png"}"

                    alt="${escapeHTML(match.teamB || "Team B")}"

                    onerror="this.src='assets/default-team.png'"

                >

                <p>

                    ${escapeHTML(match.teamB || "Team B")}

                </p>

            </div>

        </div>


        <div class="match-info">

            ${escapeHTML(match.matchTime || match.date || "")}

        </div>


        <button class="tradeBtn">

            Trade Now

        </button>

    `;


    card
        .querySelector(".tradeBtn")
        .addEventListener("click",()=>{

            window.location.href =
                "trade.html?id=" + encodeURIComponent(id);

        });


    liveMatches.appendChild(card);

}


/* =========================================
   SECURITY / TEXT CLEANING
========================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
