<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Fantasy Adda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #8B0000, #d40000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .container {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 20px;
            padding: 35px 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease;
        }

        .logo {
            width: 90px;
            display: block;
            margin: auto;
            margin-bottom: 20px;
        }

        .card h2 {
            text-align: center;
            color: #b80000;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .card p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 16px;
            color: #888;
            font-size: 16px;
        }

        .input-box input {
            width: 100%;
            padding: 14px 45px;
            border: 1px solid #ddd;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-box input:focus {
            border-color: #b80000;
            box-shadow: 0 0 0 3px rgba(184, 0, 0, 0.1);
        }

        .input-box input.error {
            border-color: #d40000;
        }

        .input-box input.success {
            border-color: #28a745;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 15px;
            cursor: pointer;
            color: #888;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #b80000;
        }

        .remember {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .remember label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #555;
        }

        .remember input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #b80000;
        }

        .remember a {
            color: #b80000;
            text-decoration: none;
        }

        .remember a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #b80000;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: #8b0000;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .or {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: #666;
            position: relative;
        }

        .or::before,
        .or::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: #ddd;
        }

        .or::before {
            left: 0;
        }

        .or::after {
            right: 0;
        }

        .google {
            background: #fff;
            color: #444;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .google:hover {
            background: #f4f4f4;
            border-color: #bbb;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }

        .bottom a {
            color: #b80000;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #d40000;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
            background: #fff0f0;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ffd6d6;
        }

        .success-msg {
            color: #28a745;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
            background: #f0fff4;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d4edda;
        }

        .field-error {
            color: #d40000;
            font-size: 12px;
            margin-top: 4px;
            display: none;
            padding-left: 10px;
        }

        .password-hint {
            color: #777;
            font-size: 12px;
            margin-top: 4px;
            padding-left: 10px;
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 8px;
            transition: width 0.3s, background 0.3s;
            width: 0%;
            background: #ddd;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width: 450px) {
            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="assets/logo.png" alt="Fantasy Adda Logo" class="logo">
            <h2>Create Account</h2>
            <p>Join Fantasy Adda</p>

            <form id="signupForm">
                <div class="input-box">
                    <i class="fa fa-user"></i>
                    <input type="text" id="name" placeholder="Full Name" required autocomplete="name">
                    <div class="field-error" id="nameError">Please enter your full name</div>
                </div>

                <div class="input-box">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                    <div class="field-error" id="emailError">Please enter a valid email</div>
                </div>

                <div class="input-box">
                    <i class="fa fa-mobile-alt"></i>
                    <input type="tel" id="phone" placeholder="Mobile Number (10 digits)" maxlength="10" required autocomplete="tel">
                    <div class="field-error" id="phoneError">Please enter a 10-digit mobile number</div>
                </div>

                <div class="input-box">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="password" placeholder="Password (min 6 chars)" required autocomplete="new-password">
                    <span class="toggle-password" id="togglePassword">
                        <i class="fa fa-eye"></i>
                    </span>
                    <div class="password-hint">Must be at least 6 characters</div>
                    <div class="password-strength" id="passwordStrength"></div>
                    <div class="field-error" id="passwordError">Password must be at least 6 characters</div>
                </div>

                <div class="input-box">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password">
                    <span class="toggle-password" id="toggleConfirmPassword">
                        <i class="fa fa-eye"></i>
                    </span>
                    <div class="field-error" id="confirmError">Passwords do not match</div>
                </div>

                <div class="input-box">
                    <i class="fa fa-gift"></i>
                    <input type="text" id="referral" placeholder="Referral Code (Optional)" maxlength="20">
                </div>

                <div class="remember">
                    <label>
                        <input type="checkbox" id="terms" required>
                        I Agree Terms & Conditions
                    </label>
                </div>

                <button type="submit" id="signupBtn">Create Account</button>

                <div id="errorMsg" class="error-msg"></div>
                <div id="successMsg" class="success-msg"></div>
            </form>

            <div class="or">OR</div>

            <button class="google" id="googleBtn">
                <i class="fab fa-google"></i>
                Continue With Google
            </button>

            <div class="bottom">
                Already have an account?
                <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-database-compat.js"></script>

    <script>
        // ======================================
        // Firebase Configuration
        // ======================================
        const firebaseConfig = {
            apiKey: "AIzaSyACztDFFn-xL75-32PYd1vsyjHKBod-UzA",
            authDomain: "fantasy-adda-e3b72.firebaseapp.com",
            projectId: "fantasy-adda-e3b72",
            storageBucket: "fantasy-adda-e3b72.firebasestorage.app",
            messagingSenderId: "882657286194",
            appId: "1:882657286194:web:284e818359de2363f0442b",
            measurementId: "G-8HJX9NRL1B"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ======================================
        // DOM Elements
        // ======================================
        const signupForm = document.getElementById('signupForm');
        const signupBtn = document.getElementById('signupBtn');

        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const referralInput = document.getElementById('referral');
        const termsCheck = document.getElementById('terms');

        const togglePassword = document.getElementById('togglePassword');
        const toggleConfirm = document.getElementById('toggleConfirmPassword');

        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const phoneError = document.getElementById('phoneError');
        const passwordError = document.getElementById('passwordError');
        const confirmError = document.getElementById('confirmError');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        const passwordStrength = document.getElementById('passwordStrength');

        // ======================================
        // Toggle Password Visibility
        // ======================================
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        toggleConfirm.addEventListener('click', function() {
            const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // ======================================
        // Show/Hide Messages
        // ======================================
        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
        }

        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
        }

        function hideMessages() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        function showFieldError(element) {
            element.style.display = 'block';
        }

        function hideFieldError(element) {
            element.style.display = 'none';
        }

        // ======================================
        // Password Strength Indicator
        // ======================================
        passwordInput.addEventListener('input', function() {
            const val = this.value;
            let strength = 0;

            if (val.length >= 6) strength += 25;
            if (val.length >= 10) strength += 25;
            if (/[A-Z]/.test(val)) strength += 20;
            if (/[0-9]/.test(val)) strength += 15;
            if (/[^A-Za-z0-9]/.test(val)) strength += 15;

            passwordStrength.style.width = strength + '%';

            if (strength < 30) {
                passwordStrength.style.background = '#d40000';
            } else if (strength < 60) {
                passwordStrength.style.background = '#ff8c00';
            } else if (strength < 80) {
                passwordStrength.style.background = '#ffd700';
            } else {
                passwordStrength.style.background = '#28a745';
            }
        });

        // ======================================
        // Phone Number Validation
        // ======================================
        phoneInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value.length > 10) {
                this.value = this.value.slice(0, 10);
            }
        });

        // ======================================
        // Form Validation
        // ======================================
        function validateForm() {
            let isValid = true;

            // Name
            if (nameInput.value.trim().length < 2) {
                showFieldError(nameError);
                nameInput.classList.add('error');
                isValid = false;
            } else {
                hideFieldError(nameError);
                nameInput.classList.remove('error');
                nameInput.classList.add('success');
            }

            // Email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value.trim())) {
                showFieldError(emailError);
                emailInput.classList.add('error');
                isValid = false;
            } else {
                hideFieldError(emailError);
                emailInput.classList.remove('error');
                emailInput.classList.add('success');
            }

            // Phone
            const phoneRegex = /^[0-9]{10}$/;
            if (!phoneRegex.test(phoneInput.value)) {
                showFieldError(phoneError);
                phoneInput.classList.add('error');
                isValid = false;
            } else {
                hideFieldError(phoneError);
                phoneInput.classList.remove('error');
                phoneInput.classList.add('success');
            }

            // Password
            if (passwordInput.value.length < 6) {
                showFieldError(passwordError);
                passwordInput.classList.add('error');
                isValid = false;
            } else {
                hideFieldError(passwordError);
                passwordInput.classList.remove('error');
                passwordInput.classList.add('success');
            }

            // Confirm Password
            if (confirmInput.value !== passwordInput.value || confirmInput.value === '') {
                showFieldError(confirmError);
                confirmInput.classList.add('error');
                isValid = false;
            } else {
                hideFieldError(confirmError);
                confirmInput.classList.remove('error');
                confirmInput.classList.add('success');
            }

            // Terms
            if (!termsCheck.checked) {
                showError('Please accept the Terms & Conditions');
                isValid = false;
            }

            return isValid;
        }

        // ======================================
        // Sign Up with Email & Password
        // ======================================
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            if (!validateForm()) {
                return;
            }

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const phone = phoneInput.value;
            const password = passwordInput.value;
            const referral = referralInput.value.trim();

            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating Account...';

            try {
                // Create user
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Update profile
                await user.updateProfile({
                    displayName: name
                });

                // Save user data to database
                await database.ref('users/' + user.uid).set({
                    name: name,
                    email: email,
                    phone: phone,
                    referral: referral || '',
                    wallet: {
                        balance: 100, // Welcome bonus
                        totalDeposited: 0,
                        totalWithdrawn: 0,
                        totalWon: 0
                    },
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                });

                showSuccess('Account created successfully! Welcome to Fantasy Adda! 🎉');

                // Redirect after delay
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (error) {
                console.error('Signup Error:', error);
                let errorMessage = 'Signup failed. Please try again.';

                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'This email is already registered. Please login.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Invalid email address.';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Password is too weak. Use at least 6 characters.';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage = 'Email/Password signup is currently disabled.';
                        break;
                    default:
                        errorMessage = error.message || 'Signup failed. Please try again.';
                }

                showError(errorMessage);
            } finally {
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create Account';
            }
        });

        // ======================================
        // Google Sign-Up
        // ======================================
        const googleBtn = document.getElementById('googleBtn');

        googleBtn.addEventListener('click', async () => {
            hideMessages();
            googleBtn.disabled = true;
            googleBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Connecting...';

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                // Check if user already exists in database
                const userRef = database.ref('users/' + user.uid);
                const snapshot = await userRef.once('value');

                if (!snapshot.exists()) {
                    // New user - save to database
                    await userRef.set({
                        name: user.displayName || 'User',
                        email: user.email,
                        phone: user.phoneNumber || '',
                        referral: '',
                        wallet: {
                            balance: 100,
                            totalDeposited: 0,
                            totalWithdrawn: 0,
                            totalWon: 0
                        },
                        createdAt: Date.now(),
                        updatedAt: Date.now()
                    });
                }

                showSuccess('Google signup successful! Redirecting...');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Google Signup Error:', error);
                let errorMessage = 'Google signup failed. Please try again.';

                if (error.code === 'auth/popup-closed-by-user') {
                    errorMessage = 'Sign-in popup was closed. Please try again.';
                } else if (error.code === 'auth/popup-blocked') {
                    errorMessage = 'Pop-up was blocked. Please allow pop-ups and try again.';
                }

                showError(errorMessage);
            } finally {
                googleBtn.disabled = false;
                googleBtn.innerHTML = '<i class="fab fa-google"></i> Continue With Google';
            }
        });

        // ======================================
        // Check if user is already logged in
        // ======================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is already logged in, redirect to home
                window.location.href = 'index.html';
            }
        });

        // ======================================
        // Real-time validation on blur
        // ======================================
        nameInput.addEventListener('blur', () => {
            if (nameInput.value.trim().length < 2) {
                showFieldError(nameError);
                nameInput.classList.add('error');
            } else {
                hideFieldError(nameError);
                nameInput.classList.remove('error');
                nameInput.classList.add('success');
            }
        });

        emailInput.addEventListener('blur', () => {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value.trim())) {
                showFieldError(emailError);
                emailInput.classList.add('error');
            } else {
                hideFieldError(emailError);
                emailInput.classList.remove('error');
                emailInput.classList.add('success');
            }
        });

        phoneInput.addEventListener('blur', () => {
            const phoneRegex = /^[0-9]{10}$/;
            if (!phoneRegex.test(phoneInput.value)) {
                showFieldError(phoneError);
                phoneInput.classList.add('error');
            } else {
                hideFieldError(phoneError);
                phoneInput.classList.remove('error');
                phoneInput.classList.add('success');
            }
        });

        confirmInput.addEventListener('input', () => {
            if (confirmInput.value !== passwordInput.value) {
                showFieldError(confirmError);
                confirmInput.classList.add('error');
            } else {
                hideFieldError(confirmError);
                confirmInput.classList.remove('error');
                confirmInput.classList.add('success');
            }
        });
    </script>
</body>
</html>
