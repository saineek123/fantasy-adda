<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches - Fantasy Adda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f6fa;padding-bottom:80px}
header{background:#b80000;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
header h2{font-size:20px}.back{color:#fff;text-decoration:none;font-size:22px}
.container{max-width:600px;margin:20px auto;padding:0 15px}
.tabs{display:flex;gap:8px;background:#fff;padding:7px;border-radius:12px;margin-bottom:20px}
.tab{flex:1;padding:11px;border:0;border-radius:8px;background:#f1f1f1;font-weight:bold;cursor:pointer}
.tab.active{background:#b80000;color:#fff}
.card{background:#fff;padding:17px;border-radius:15px;margin-bottom:15px;box-shadow:0 3px 12px #0001}
.teams{display:flex;align-items:center;justify-content:space-between;text-align:center}
.team{width:40%}.team img{width:60px;height:60px;object-fit:contain;border-radius:50%}
.team p{font-weight:bold;margin-top:6px}.vs{font-weight:bold;color:#b80000}
.info{text-align:center;margin-top:12px;color:#777;font-size:13px}
.status{display:inline-block;margin-top:7px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:bold}
.live{background:#ff4d4d;color:#fff}.upcoming{background:#ffd700;color:#222}.completed{background:#28a745;color:#fff}
.trade{width:100%;margin-top:13px;padding:11px;border:0;border-radius:9px;background:#b80000;color:#fff;font-weight:bold;font-size:15px}
.empty{text-align:center;padding:50px 10px;color:#777}
.loading{text-align:center;padding:40px;color:#777}
nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:12px;box-shadow:0 -3px 10px #0002}
nav a{color:#666;text-decoration:none;text-align:center;font-size:12px}nav i{display:block;font-size:20px;margin-bottom:4px}
</style>
</head>
<body>
<header>
<h2><i class="fa fa-trophy"></i> Matches</h2>
<a class="back" href="index.html"><i class="fa fa-home"></i></a>
</header>

<div class="container">
<div class="tabs">
<button class="tab active" data-tab="live">Live</button>
<button class="tab" data-tab="upcoming">Upcoming</button>
<button class="tab" data-tab="completed">Completed</button>
</div>
<div id="container" class="loading">Loading matches...</div>
</div>

<nav>
<a href="index.html"><i class="fa fa-home"></i>Home</a>
<a href="matches.html"><i class="fa fa-trophy"></i>Matches</a>
<a href="wallet.html"><i class="fa fa-wallet"></i>Wallet</a>
<a href="profile.html"><i class="fa fa-user"></i>Profile</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyACztDFFn-xL75-32PYd1vsyjHKBod-UzA",
authDomain:"fantasy-adda-e3b72.firebaseapp.com",
projectId:"fantasy-adda-e3b72",
storageBucket:"fantasy-adda-e3b72.firebasestorage.app",
messagingSenderId:"882657286194",
appId:"1:882657286194:web:284e818359de2363f0442b",
measurementId:"G-8HJX9NRL1B"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
const box=document.getElementById("container");
let tab="live";

document.querySelectorAll(".tab").forEach(b=>{
b.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
tab=b.dataset.tab;
load();
};
});

auth.onAuthStateChanged(user=>{
if(!user){
box.innerHTML='<div class="empty">Please login first.</div>';
return;
}
load();
});

function load(){
box.innerHTML='<div class="loading">Loading matches...</div>';

db.ref("matches").once("value").then(snap=>{
box.innerHTML="";
if(!snap.exists()){
box.innerHTML='<div class="empty"><i class="fa fa-trophy fa-3x"></i><br><br>No matches available</div>';
return;
}

const data=snap.val();
const list=Object.entries(data).filter(([id,m])=>{
if(tab==="live")return m.status==="Live";
if(tab==="upcoming")return m.status==="Upcoming";
return m.status==="Completed"||m.status==="Finished";
});

if(!list.length){
box.innerHTML=`<div class="empty">No ${tab} matches</div>`;
return;
}

list.sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
list.forEach(([id,m])=>render(id,m));
}).catch(e=>{
console.error(e);
box.innerHTML='<div class="empty">❌ '+e.message+'</div>';
});
}

function render(id,m){
const status=(m.status||"Upcoming").toLowerCase();
const card=document.createElement("div");
card.className="card";

const defaultLogo="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(
`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" rx="100" fill="#eeeeee"/><text x="100" y="120" text-anchor="middle" font-size="80">🏏</text></svg>`);

card.innerHTML=`
<div class="teams">
<div class="team"><img src="${escapeAttr(m.teamALogo||defaultLogo)}"><p>${escapeHtml(m.teamA||"Team A")}</p></div>
<div class="vs">VS</div>
<div class="team"><img src="${escapeAttr(m.teamBLogo||defaultLogo)}"><p>${escapeHtml(m.teamB||"Team B")}</p></div>
</div>
<div class="info">
<div>${escapeHtml(m.league||"")}</div>
<div>${escapeHtml(m.venue||"")}</div>
<div>🕐 ${escapeHtml(m.matchTime||"")}</div>
<span class="status ${status}">${escapeHtml(m.status||"Upcoming")}</span>
</div>
<button class="trade">${m.status==="Live"?"⚡ Trade Now":m.status==="Completed"||m.status==="Finished"?"Match Ended":"📅 Trade Now"}</button>`;

const btn=card.querySelector(".trade");
if(m.status==="Completed"||m.status==="Finished")btn.disabled=true;
else btn.onclick=()=>location.href="trade.html?id="+encodeURIComponent(id);

box.appendChild(card);
}

function escapeHtml(v){
return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function escapeAttr(v){return escapeHtml(v)}

</script>
</body>
</html>
