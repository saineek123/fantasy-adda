<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet • Fantasy Adda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f6f8;padding-bottom:80px}
.header{background:#B80000;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.header h2{font-size:18px}
.container{max-width:600px;margin:auto;padding:15px}

.balance-card{
  background:linear-gradient(135deg,#B80000,#ff4d4d);color:#fff;
  border-radius:20px;padding:22px;margin-bottom:16px;
  box-shadow:0 8px 25px rgba(184,0,0,.3);
}
.balance-card small{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.balance-card h1{font-size:34px;font-weight:800;margin:8px 0}
.balance-card .row{display:flex;gap:10px;margin-top:16px}
.balance-card .btn{
  flex:1;background:rgba(255,255,255,.2);color:#fff;border:0;
  padding:11px;border-radius:11px;font-weight:700;font-size:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
}
.balance-card .btn:hover{background:rgba(255,255,255,.3)}

.stats-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;
}
.stat-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0001}
.stat-card small{font-size:10px;color:#888;text-transform:uppercase;font-weight:700}
.stat-card b{display:block;font-size:20px;margin-top:6px;font-weight:800}
.stat-card.green b{color:#0aa84f}
.stat-card.red b{color:#d92d20}
.stat-card.blue b{color:#2563eb}
.stat-card.orange b{color:#f59e0b}

.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 i{color:#B80000}

.tx-row{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  padding:11px 0;border-bottom:1px solid #f0f1f3;font-size:12px;
}
.tx-row:last-child{border-bottom:0}
.tx-row b{font-size:13px;display:block}
.tx-row small{color:#888;font-size:10px}

.empty{text-align:center;padding:30px 20px;color:#999;font-size:12px}
.empty i{font-size:36px;color:#ccc;margin-bottom:8px;display:block}
</style>
</head>
<body>

<div class="header">
  <h2><i class="fa fa-wallet"></i> Wallet</h2>
  <a href="index.html" style="color:#fff"><i class="fa fa-home"></i></a>
</div>

<div class="container">

  <div class="balance-card">
    <small>Total Balance</small>
    <h1 id="totalBalance">₹0.00</h1>
    <div class="row">
      <button class="btn" onclick="location.href='recharge.html'">
        <i class="fa fa-plus"></i> Add Money
      </button>
      <button class="btn" onclick="location.href='withdraw.html'">
        <i class="fa fa-arrow-up"></i> Withdraw
      </button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card green">
      <small>Total Won</small>
      <b id="totalWon">₹0.00</b>
    </div>
    <div class="stat-card red">
      <small>Total Invested</small>
      <b id="totalInvested">₹0.00</b>
    </div>
    <div class="stat-card blue">
      <small>Open Positions</small>
      <b id="openPositions">0</b>
    </div>
    <div class="stat-card orange">
      <small>Total P&L</small>
      <b id="totalPnl">₹0.00</b>
    </div>
  </div>

  <div class="card">
    <h3><i class="fa fa-list"></i> Recent Transactions</h3>
    <div id="txList"><div class="empty">Loading...</div></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyACztDFFn-xL75-32PYd1vsyjHKBod-UzA",
  authDomain:"fantasy-adda-e3b72.firebaseapp.com",
  databaseURL:"https://fantasy-adda-e3b72-default-rtdb.firebaseio.com",
  projectId:"fantasy-adda-e3b72",
  storageBucket:"fantasy-adda-e3b72.firebasestorage.app",
  messagingSenderId:"882657286194",
  appId:"1:882657286194:web:284e818359de2363f0442b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}

auth.onAuthStateChanged(user=>{
  if(!user){ location.href='login.html'; return; }

  // Balance
  db.ref('users/'+user.uid+'/wallet/balance').on('value', s=>{
    document.getElementById('totalBalance').textContent = money(s.val()||0);
  });

  // Trades
  db.ref('trades').orderByChild('userId').equalTo(user.uid).on('value', s=>{
    let invested=0, won=0, open=0, pnl=0;
    s.forEach(c=>{
      const t = c.val();
      invested += Number(t.amount||0);
      if(t.status === 'pending' || t.status === 'open'){
        open++;
      } else if(t.status === 'win'){
        won += Number(t.winAmount||0);
        pnl += Number(t.pnl || (Number(t.winAmount||0) - Number(t.amount||0)));
      } else if(t.status === 'loss'){
        pnl -= Number(t.amount||0);
      }
    });
    document.getElementById('totalInvested').textContent = money(invested);
    document.getElementById('totalWon').textContent = money(won);
    document.getElementById('openPositions').textContent = open;
    document.getElementById('totalPnl').textContent = (pnl>=0?'+':'') + money(pnl);
  });

  // Transactions
  db.ref('transactions').orderByChild('userId').equalTo(user.uid).on('value', s=>{
    const arr = [];
    s.forEach(c => arr.push(c.val()));
    arr.sort((a,b)=>(b.date||0)-(a.date||0));

    const box = document.getElementById('txList');
    if(!arr.length){ box.innerHTML = '<div class="empty">No transactions yet</div>'; return; }

    box.innerHTML = arr.slice(0,20).map(t=>`
      <div class="tx-row">
        <div>
          <b style="color:${t.type==='credit'?'#0aa84f':'#d92d20'}">
            ${t.type==='credit'?'+':'-'}${money(t.amount)}
          </b>
          <small>${t.description||''}</small>
        </div>
        <div style="text-align:right">
          <small>${new Date(t.date).toLocaleDateString('en-IN')}</small>
        </div>
      </div>
    `).join('');
  });
});
</script>

</body>
</html>
