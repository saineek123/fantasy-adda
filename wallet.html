<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Wallet</title>

<link rel="stylesheet"
href="css/wallet.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header>

<h2>My Wallet</h2>

</header>

<div class="container">

<div class="total-card">

<h4>Total Balance</h4>

<h1 id="totalBalance">₹0.00</h1>

</div>

<div class="wallet-grid">

<div class="wallet-box">

<h3>Recharge</h3>

<p id="recharge">₹0</p>

</div>

<div class="wallet-box">

<h3>Winning</h3>

<p id="winning">₹0</p>

</div>

<div class="wallet-box">

<h3>Bonus</h3>

<p id="bonus">₹0</p>

</div>

</div>

<div class="buttons">

<button onclick="location.href='add-money.html'">

Add Money

</button>

<button onclick="location.href='withdraw.html'">

Withdraw

</button>

</div>

<h3 class="title">

Recent Transactions

</h3>

<div id="transactionList">

No Transactions

</div>

</div>

<script type="module"
src="js/firebase.js"></script>

<script type="module"
src="js/session.js"></script>

<script type="module"
src="js/wallet.js"></script>

</body>

</html>
