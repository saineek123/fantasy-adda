<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fantasy Adda Login</title>

<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<div class="card">

<img src="assets/logo.png" class="logo">

<h2>Fantasy Adda</h2>

<p>Welcome Back</p>

<form id="loginForm">

<div class="input-box">

<i class="fa fa-mobile"></i>

<input type="email" id="phone" placeholder="Email Address">

</div>

<div class="input-box">

<i class="fa fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password">

<span id="togglePassword">

<i class="fa fa-eye"></i>

</span>

</div>

<div class="remember">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">

Login

</button>

</form>

<div class="or">

OR

</div>

<button class="google">

<i class="fab fa-google"></i>

Continue With Google

</button>

<div class="bottom">

Don't have account?

<a href="signup.html">

Create Account

</a>

</div>

</div>

</div>

<script src="js/auth.js"></script>
<script type="module" src="js/firebase.js"></script>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/session.js"></script>
</body>
</html>
